name: Weekly Google Rank Check

on:
  schedule:
    - cron: "10 9 * * 1"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Google rankings
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python weekly_check.py

      - name: Save ranking history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rank_history.csv
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update weekly ranking history"
            git push
          fi
